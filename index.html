<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- [반응형 필수] 기기 너비에 맞춰 화면을 그리도록 설정. 없으면 모바일에서 PC 화면이 축소되어 보입니다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Prep- 모바일 퍼스트 반응형 예제</title>

  <!-- 폰트: Pretendard -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ================= MAIN ================= -->
  <main class="main container">

    <!-- 타이틀 -->
    <div class="hero">
      <h1 class="hero__title">
        <span class="hero__line">RESPONSIVE</span>
        <span class="hero__line">WEB DESIGN</span>
        <!-- 네모(hero__dot)는 마지막 줄 GUIDE 바로 옆에 붙음 -->
        <span class="hero__line hero__line--dot">GUIDE<span class="hero__dot" aria-hidden="true"></span></span>
      </h1>
    </div>

    <!-- 수업 단계: 모바일·PC 모두 3개, 이미지 크기와 간격은 clamp로 유동 변화 -->
    <nav class="steps" aria-label="수업 단계">
      <a href="#" class="step">
        <span class="step__thumb"><img src="images/step-1.png" alt=""></span>
        <span class="step__label"><img src="images/dot-blue.svg" alt="" class="step__dot">STEP 1</span>
      </a>
      <a href="#" class="step">
        <span class="step__thumb"><img src="images/step-2.png" alt=""></span>
        <span class="step__label"><img src="images/dot-green.svg" alt="" class="step__dot">STEP 2</span>
      </a>
      <a href="clamp/" class="step">
        <span class="step__thumb"><img src="images/step-3.png" alt=""></span>
        <span class="step__label"><img src="images/dot-orange.svg" alt="" class="step__dot">Clamp와 vW</span>
      </a>
    </nav>

  </main>

</body>
</html>
